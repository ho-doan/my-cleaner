[package]
name = "cleanrs"
version = "0.1.0"
edition = "2021"
description = "Safe, rule-based disk cleanup for macOS"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cleanrs-core = { path = "../cleanrs-core" }
comfy-table = "7"
humansize = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "cleanrs"
path = "src/main.rs"

