[package]
name = "cleanrs-core"
version = "0.1.0"
edition = "2021"
description = "Core scanning and cleaning rules for cleanrs"
license = "MIT"

[dependencies]
anyhow = "1"
fs2 = "0.4"
jwalk = "0.8"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
toml = "0.8"
trash = "5"

[dev-dependencies]
tempfile = "3"
