name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: "Build ${{ matrix.target }}"
    runs-on: "${{ matrix.runner }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.ref }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "${{ matrix.target }}"
      - run: cargo build --release --locked -p cleanrs --target "${{ matrix.target }}"
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging="cleanrs-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/cleanrs" "$staging/cleanrs"
          tar -czf "${staging}.tar.gz" -C "$staging" cleanrs
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "cleanrs-${env:GITHUB_REF_NAME}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\cleanrs.exe" "$staging\cleanrs.exe"
          Compress-Archive -Path "$staging\cleanrs.exe" -DestinationPath "$staging.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: "cleanrs-${{ matrix.target }}"
          path: |
            cleanrs-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            cleanrs-${{ github.ref_name }}-${{ matrix.target }}.zip

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate release checksums
        shell: bash
        run: |
          cd dist
          sha256sum cleanrs-*.tar.gz cleanrs-*.zip > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cleanrs-*.tar.gz
            dist/cleanrs-*.zip
            dist/checksums.txt
