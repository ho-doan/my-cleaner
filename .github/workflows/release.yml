name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-14
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p cleanrs --target ${{ matrix.target }}
     - name: Package binary
       run: |
         staging="cleanrs-${GITHUB_REF_NAME}-${{ matrix.target }}"
         mkdir -p "$staging"
         cp "target/${{ matrix.target }}/release/cleanrs" "$staging/cleanrs"
         tar -czf "${staging}.tar.gz" -C "$staging" cleanrs
      - uses: actions/upload-artifact@v4
       with:
          name: cleanrs-${{ matrix.target }}
          path: cleanrs-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/cleanrs-*.tar.gz
